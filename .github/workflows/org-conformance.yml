name: Org conformance

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: org-conformance-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  org-conformance:
    uses: BehindTheMusicTree/github-workflows/.github/workflows/org-conformance.yml@3c6f2441802eb0c75432ad0c629d9775e652ed8c # v6.7.0
    permissions:
      contents: read
