name: Synchronize public brand assets
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact npm version already published (without v prefix)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: brand-assets-public
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: brand-assets-public
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Synchronize immutable objects from published npm archive
        env:
          ASSET_VERSION: ${{ inputs.version }}
          BRAND_ASSETS_BUCKET: ${{ vars.BRAND_ASSETS_BUCKET }}
          BRAND_ASSETS_PUBLIC_URL: ${{ vars.BRAND_ASSETS_PUBLIC_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRAND_ASSETS_ACCESS_KEY_ID: ${{ secrets.BRAND_ASSETS_ACCESS_KEY_ID }}
          BRAND_ASSETS_SECRET_ACCESS_KEY: ${{ secrets.BRAND_ASSETS_SECRET_ACCESS_KEY }}
        run: node scripts/assets/sync.mjs "$ASSET_VERSION"
