name: Agent drift
on: [push, pull_request]
permissions:
  contents: read

concurrency:
  group: agent-drift-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent-drift:
    uses: BehindTheMusicTree/github-workflows/.github/workflows/agent-drift.yml@3c6f2441802eb0c75432ad0c629d9775e652ed8c # v6.7.0
    permissions:
      contents: read
