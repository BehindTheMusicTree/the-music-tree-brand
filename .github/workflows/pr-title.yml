# Own workflow: the `edited` trigger must not rerun the test suite.
name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    uses: BehindTheMusicTree/github-workflows/.github/workflows/pr-title.yml@3c6f2441802eb0c75432ad0c629d9775e652ed8c # v6.7.0
