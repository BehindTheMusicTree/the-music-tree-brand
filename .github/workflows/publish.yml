name: Publish to npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout release foundation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: BehindTheMusicTree/github-workflows
          ref: 91a81d064801fe3c2e460882067220b3cb39d542
          path: .release-foundation
          persist-credentials: false

      - name: Validate tag and release notes
        run: python3 .release-foundation/release/github-release.py notes "$RUNNER_TEMP/release-notes.md"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @behindthemusictree/brand run build
        env:
          # Build-time values are embedded in the published package.
          ORG_DOMAIN: ${{ vars.DOMAIN_NAME }}
          ORG_NAME: ${{ vars.ORG_NAME }}
          ORG_GITHUB_SPONSOR_BUTTON_URL: ${{ vars.ORG_GITHUB_SPONSOR_BUTTON_URL }}
          ORG_GITHUB_URL: ${{ vars.ORG_GITHUB_URL }}
          HTMT_API_REPO_NAME: ${{ vars.HTMT_API_REPO_NAME }}
          GTMT_API_REPO_NAME: ${{ vars.GTMT_API_REPO_NAME }}
          GTMT_FRONT_REPO_NAME: grow-the-music-tree-frontend
          TMD_ADMIN_API_REPO_NAME: ${{ vars.TMD_ADMIN_REPO_NAME }}
          TMD_ADMIN_REPO_NAME: ${{ vars.TMD_ADMIN_REPO_NAME }}
          ORG_PYPI_URL: ${{ vars.ORG_PYPI_URL }}
          ORG_LINKEDIN_URL: ${{ vars.ORG_LINKEDIN_URL }}
          ORG_X_URL: ${{ vars.ORG_X_URL }}
          ORG_MASTODON_URL: ${{ vars.ORG_MASTODON_URL }}
          ORG_YOUTUBE_URL: ${{ vars.ORG_YOUTUBE_URL }}
          ORG_SPOTIFY_URL: ${{ vars.ORG_SPOTIFY_URL }}
          ORG_DISCORD_URL: ${{ vars.ORG_DISCORD_URL }}
          ORG_TIPEEE_URL: ${{ vars.ORG_TIPEEE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          HTMT_FRONT_SUBDOMAIN: ${{ vars.HTMT_FRONT_SUBDOMAIN }}
          HTMT_API_SUBDOMAIN: ${{ vars.HTMT_API_SUBDOMAIN }}
          GTMT_FRONT_SUBDOMAIN: ${{ vars.GTMT_FRONT_SUBDOMAIN }}
          GTMT_API_SUBDOMAIN: ${{ vars.GTMT_API_SUBDOMAIN }}
          AUDIOMETA_FRONT_SUBDOMAIN: ${{ vars.AUDIOMETA_FRONT_SUBDOMAIN }}
          AUDIOMETA_API_SUBDOMAIN: ${{ vars.AUDIOMETA_API_SUBDOMAIN }}
          TMTA_SUBDOMAIN: ${{ vars.TMTA_SUBDOMAIN }}
          TMD_GAME_SUBDOMAIN: ${{ vars.TMD_GAME_SUBDOMAIN }}
          TMD_SHOWCASE_SUBDOMAIN: ${{ vars.TMD_SHOWCASE_SUBDOMAIN }}

      # pnpm pack rewrites workspace:/catalog: specifiers. The trusted publisher on npmjs must allow
      # direct `npm publish` (Allow npm publish), otherwise this step fails with ENEEDAUTH.
      - run: npm install -g npm@11.21.1
      - run: pnpm --filter @behindthemusictree/brand pack --pack-destination "$RUNNER_TEMP"
      - name: Check existing npm artifact
        id: registry
        run: node .release-foundation/release/npm-artifact.cjs @behindthemusictree/brand "$(node -p "require('./packages/brand/package.json').version")" "$RUNNER_TEMP"/behindthemusictree-brand-*.tgz
      - if: steps.registry.outputs.exists != 'true'
        run: npm publish "$RUNNER_TEMP"/behindthemusictree-brand-*.tgz --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
